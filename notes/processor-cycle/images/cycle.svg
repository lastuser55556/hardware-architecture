<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600"><style>text{font-family:Arial;font-size:20px}.h{font-size:28px;font-weight:bold}.b{fill:#fff;stroke:#222;stroke-width:2}.a{stroke:#222;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z"/></marker></defs><text x="30" y="40" class="h">Рабочий цикл процессора</text><rect class="b" x="250" y="75" width="400" height="65"/><text x="335" y="115">1. Выборка команды из ОП</text><rect class="b" x="250" y="175" width="400" height="65"/><text x="325" y="215">2. Выборка операндов</text><rect class="b" x="250" y="275" width="400" height="65"/><text x="315" y="315">3. Выполнение операции в АЛУ</text><rect class="b" x="250" y="375" width="400" height="65"/><text x="315" y="415">4. Запись результата в ОП</text><rect class="b" x="250" y="475" width="400" height="65"/><text x="320" y="515">5. Продвижение СчАК на L</text><line class="a" x1="450" y1="140" x2="450" y2="170"/><line class="a" x1="450" y1="240" x2="450" y2="270"/><line class="a" x1="450" y1="340" x2="450" y2="370"/><line class="a" x1="450" y1="440" x2="450" y2="470"/></svg>